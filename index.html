<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scibook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Physics, chemistry, biology and astronomy: interactive textbooks with labs, scored olympiad problems and three science games.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      macros: {
        dd: '\\mathrm{d}',
        unit: ['\\,\\mathrm{#1}', 1],
        vb: ['\\mathbf{#1}', 1],
        abs: ['\\left|#1\\right|', 1]
      }
    },
    svg: { fontCache: 'global' },
    options: { enableMenu: false },
    startup: {
      typeset: false,
      ready: function () {
        MathJax.startup.defaultReady();
        document.dispatchEvent(new Event('mathjax-ready'));
      }
    }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
</head>

<div class="shell">
  <header class="hud" id="hud">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open chapter list" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>

      </span>

    </a>
    <nav class="subj-tabs" id="subjectTabs" aria-label="Sciences"></nav>
    <div class="hud-stats" id="hudStats"></div>
  </header>
  <nav class="sidebar" id="sidebar" aria-label="Chapters"></nav>
  <div class="scrim" id="scrim" hidden></div>
  <main class="main" id="main" tabindex="-1"></main>
</div>
